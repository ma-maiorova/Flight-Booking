groups:
  - name: flight-booking-slo
    interval: 30s
    rules:

      # ─── Availability SLI: error rate > 5% ──────────────────────────────────
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_request_errors_total[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate on {{ $labels.service }}"
          description: >
            Error rate is {{ humanizePercentage $value }} (threshold 5%)
            on service {{ $labels.service }} for the past 5 minutes.

      # ─── Availability SLI: error rate > 10% (critical) ──────────────────────
      - alert: CriticalErrorRate
        expr: |
          (
            sum(rate(http_request_errors_total[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical HTTP error rate on {{ $labels.service }}"
          description: >
            Error rate is {{ humanizePercentage $value }} (threshold 10%)
            on service {{ $labels.service }}.

      # ─── Latency SLI: p95 > 1s ───────────────────────────────────────────────
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service }}"
          description: >
            p95 latency is {{ printf "%.2f" $value }}s (threshold 1s)
            on service {{ $labels.service }}.

      # ─── Latency SLI: p99 > 2s (critical) ───────────────────────────────────
      - alert: CriticalLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 2.0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical p99 latency on {{ $labels.service }}"
          description: >
            p99 latency is {{ printf "%.2f" $value }}s (threshold 2s)
            on service {{ $labels.service }}.

      # ─── Service down ─────────────────────────────────────────────────────────
      - alert: ServiceDown
        expr: up{job=~"flight-service|booking-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape metrics from {{ $labels.job }}."

  - name: infrastructure
    interval: 30s
    rules:

      # ─── Redis memory > 80% ───────────────────────────────────────────────────
      - alert: RedisHighMemory
        expr: |
          redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage above 80%"
          description: "Redis is using {{ humanizePercentage $value }} of max memory."

      # ─── PostgreSQL too many connections ─────────────────────────────────────
      - alert: PostgresHighConnections
        expr: |
          pg_stat_activity_count{datname!~"template.*|postgres"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of PostgreSQL connections"
          description: "Database {{ $labels.datname }} has {{ $value }} active connections."
