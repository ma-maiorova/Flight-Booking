booking-service:
  flight-service:
    api-key: test-secret-key
  circuit-breaker:
    failure-threshold: 5
    timeout-seconds: 30
    half-open-max-calls: 3
  retry:
    max-attempts: 3
    initial-backoff-ms: 1

spring:
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
