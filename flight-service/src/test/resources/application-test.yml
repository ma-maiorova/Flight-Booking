flight-service:
  api-key: test-secret-key
  cache:
    ttl-minutes: 10

spring:
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  data:
    redis:
      sentinel:
        master: mymaster
        nodes: localhost:26379
